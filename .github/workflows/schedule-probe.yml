name: Schedule probe

# Temporary (issue #3): no Nightly run has ever been started by its schedule.
# This only prints a line every 15 minutes (off the hour), to tell whether
# GitHub skips that one workflow or every schedule in this repo. Remove once that is known.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "schedule probe ran at $(date -u +%FT%TZ) for event $GITHUB_EVENT_NAME"
