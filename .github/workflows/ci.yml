name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only, no secrets: this runs on pull requests from anyone.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: splits-reviewed.json
        run: go run ./cmd/build -validate
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: process-day.sh, session-days.sh and fetch-sec-snapshot.sh
        run: bash scripts/test-process-day.sh && bash scripts/test-session-days.sh && bash scripts/test-fetch-sec-snapshot.sh && bash scripts/test-fetch-archive.sh
      - name: No licensed figures
        run: bash scripts/test-check-no-licensed-figures.sh && bash scripts/check-no-licensed-figures.sh
