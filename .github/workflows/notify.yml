name: Notify

# Alerts from the owner's desktop (the local TL;DR Fund index job, run there
# while GitHub Actions is off for private repos): the desktop starts this with
# `gh workflow run`, and the issue it opens is the bot's, assigned to the owner,
# so GitHub emails them (scripts/notify.sh, issue #27). Only people with write
# access can start it. Each desktop run sends its result (not a change), so when
# this group replaces a pending run with a newer one, the newest result wins,
# which is the one that matters. Inputs reach the script as environment variables, never
# pasted into the script, and DETAIL is shown in a fenced block.
on:
  workflow_dispatch:
    inputs:
      event:
        description: The desktop run's result, failed or ok
        required: true
        type: choice
        options: [failed, ok]
      detail:
        description: Short error text (public)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notify-local
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'vibistic-hq/vibistic-iex-data'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ inputs.event }}
          DETAIL: ${{ inputs.detail }}
        run: scripts/notify.sh local "$EVENT" "$DETAIL"
