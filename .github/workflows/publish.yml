name: Publish

# Rebuilds every symbol file from the archived days, adds the newest SEC
# snapshot (when there is a good one) and deploys GitHub Pages. Called by the
# nightly, backfill and SEC runs; can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'vibistic-hq/vibistic-iex-data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch archived days
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-archive.sh days
      # A failing test, or a site over budget, stops here: the last deployment stays.
      - name: Test
        run: go test ./...
      # Outside the checkout, after the tests. Never stops the IEX publish: no
      # snapshot, or a bad one, only leaves v1/sec out.
      - name: Fetch the SEC snapshot
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-sec-snapshot.sh "$RUNNER_TEMP/sec"
      # Likewise: no estimates, or bad ones, only leave v1/earnings.json out.
      - name: Fetch the earnings estimates
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-earnings.sh "$RUNNER_TEMP/earnings.json"
      - name: Build
        run: |
          sec=()
          [ -f "$RUNNER_TEMP/sec/snapshot.json" ] && sec=(-sec "$RUNNER_TEMP/sec")
          [ -f "$RUNNER_TEMP/earnings.json" ] && sec+=(-earnings "$RUNNER_TEMP/earnings.json")
          go run ./cmd/build -days days -reviewed splits-reviewed.json "${sec[@]}" -out site
      - name: Check size
        run: scripts/check-site-size.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
