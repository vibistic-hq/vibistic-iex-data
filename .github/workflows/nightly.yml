name: Nightly

# IEX posts each session's file the next morning, most between 03:20 and
# 09:59 UTC, now and then as late as the next evening. So this runs every 30
# minutes from 03:07 to 11:37 UTC and again at 21:07, off the hour (GitHub
# delays or drops scheduled runs most often on the hour). A run with nothing new
# only asks IEX's index and stops. Looks back 10 days and at today in New York
# (scripts/session-days.sh), so a missed run or night catches up. An incomplete
# IEX file (exit 4) is remembered by its generation and not downloaded again
# (exit 5) until IEX replaces it; the list is kept between runs in the Actions
# cache.
on:
  schedule:
    - cron: '7,37 3-11 * * 2-6'
    - cron: '7 21 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'vibistic-hq/vibistic-iex-data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # release assets only
    outputs:
      added: ${{ steps.days.outputs.added }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o bin/iexagg ./cmd/iexagg
      # Each run (and re-run attempt) saves under its own key; the newest saved
      # list is restored.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: incomplete.txt
          key: iex-incomplete-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: iex-incomplete-
      - id: days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/archived-days.sh > archived.txt
          # Dates older than the lookback drop off the list.
          touch incomplete.txt
          oldest=$(TZ=America/New_York date -d "15 days ago" +%Y%m%d)
          awk -v o="$oldest" '$1 >= o' incomplete.txt > incomplete.new && mv incomplete.new incomplete.txt
          export IEX_INCOMPLETE="$PWD/incomplete.txt"
          mkdir -p out
          added=0
          for d in $(scripts/session-days.sh); do
            grep -qx "$d" archived.txt && continue
            # Parsing IEX's data needs no token: only archive-day.sh gets it.
            rc=0; env -u GH_TOKEN scripts/process-day.sh "$d" out || rc=$?
            [ "$rc" = 3 ] && continue
            [ "$rc" = 5 ] && { echo "::notice::$d: IEX's file is still the incomplete one, not read again"; continue; }
            # Incomplete IEX file: not archived. Recorded by process-day.sh, so
            # later runs read the day again only once IEX replaces the file.
            if [ "$rc" = 4 ]; then
              echo "::warning::$d: IEX's file is incomplete, day left out"
              echo "incomplete_changed=1" >> "$GITHUB_OUTPUT"
              continue
            fi
            [ "$rc" = 0 ] || exit "$rc"
            scripts/archive-day.sh "$d" out
            added=$((added + 1))
          done
          echo "added=$added" >> "$GITHUB_OUTPUT"
      # Saved only when a file was recorded, also when a later day then failed.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.days.outputs.incomplete_changed == '1'
        with:
          path: incomplete.txt
          key: iex-incomplete-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    needs: archive
    if: needs.archive.outputs.added != '0'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml

  # Emails the owner through GitHub issues (scripts/notify.sh, issue #27) when
  # something changes: archive starts failing (this includes IEX's bucket, read
  # while IEX refuses its HIST list) or works again, and IEX's HIST list
  # answering again. The last state is kept in the Actions cache, so a long
  # outage alerts once, not on each of the 19 runs a day.
  notify:
    needs: archive
    if: always() && github.repository == 'vibistic-hq/vibistic-iex-data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read # the failed run's log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: notify-state.txt
          key: notify-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notify-state-
      - id: notify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_RESULT: ${{ needs.archive.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          STATE: notify-state.txt
          FAILED_LOG: failed.log
        run: |
          # The last weekday before today in New York: a day IEX's list knows.
          d=$(TZ=America/New_York date -d yesterday +%Y%m%d)
          while [ "$(date -d "$d" +%u)" -gt 5 ]; do d=$(date -d "$d -1 day" +%Y%m%d); done
          INDEX_CODE=$(curl -s -o /dev/null --max-time 60 -w '%{http_code}' "https://iextrading.com/api/1.0/hist?date=$d") || INDEX_CODE=curl-failed
          export INDEX_CODE
          echo "HIST list for $d answered $INDEX_CODE; archive $ARCHIVE_RESULT"
          if [ "$ARCHIVE_RESULT" = failure ]; then
            # The finished archive job's own log (the run's is not ready while
            # this job runs): the 30 lines up to its first error, timestamps
            # and colour codes off. Best effort: the alert goes out without it.
            job=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "archive") | .id' | head -1) || job=""
            if [ -n "$job" ]; then
              gh api "repos/$GH_REPO/actions/jobs/$job/logs" 2>/dev/null \
                | sed -E 's/\x1b\[[0-9;]*m//g; s/^[0-9TZ:.-]+ //' \
                | awk '{ buf[NR % 30] = $0 } /##\[error\]/ { for (i = NR - 29; i <= NR; i++) if (i > 0) print buf[i % 30]; exit }' > "$FAILED_LOG" || true
            fi
          fi
          scripts/notify.sh nightly
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.notify.outputs.changed == '1'
        with:
          path: notify-state.txt
          key: notify-state-${{ github.run_id }}-${{ github.run_attempt }}
